[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss-combo"
version = "0.1.0"
description = "DLSS5-FrameGen: experimental DLSS 5 + Frame Generation toolkit for RTX 20/30"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/ztwzeroo/DLSS5-FrameGen"
Issues = "https://github.com/ztwzeroo/DLSS5-FrameGen/issues"

[project.scripts]
dlss-combo = "dlss_combo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
